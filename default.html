<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e8eae7;
      --ink: #12161a;
      --muted: #5d6560;
      --line: #c9ccc7;
      --accent: #1d5c4f;
      --display: "Space Grotesk", system-ui, sans-serif;
      --body: "Inter", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 46rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    .name {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.9rem, 13vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      margin: 0 0 2rem;
    }

    .manifest {
      font-family: var(--mono);
      font-size: 0.82rem;
      border-top: 1px solid var(--line);
      margin-bottom: 3.5rem;
    }
    .manifest div {
      display: flex;
      gap: 1.25rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--line);
    }
    .manifest dt, .manifest span:first-child {
      color: var(--muted);
      flex: 0 0 5.5rem;
      text-transform: lowercase;
      letter-spacing: 0.04em;
    }

    h2 {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 3rem 0 0.9rem;
    }

    p { margin: 0 0 1.1rem; max-width: 34rem; }

    ul { padding-left: 1.1rem; margin: 0 0 1.1rem; max-width: 34rem; }
    li { margin-bottom: 0.35rem; }

    a {
      color: var(--ink);
      text-decoration-color: var(--line);
      text-underline-offset: 0.22em;
      transition: color 0.15s ease;
    }
    a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer {
      margin-top: 4rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .wrap > * { animation: rise 0.5s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      .wrap > * { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    {{ content }}
    <footer>
      {{ site.title }} &middot; {{ 'now' | date: "%Y" }} &middot; feito com Jekyll e GitHub Pages
    </footer>
  </div>
</body>
</html>
